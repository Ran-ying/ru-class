<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RU-Class · v0.1</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><strong>RU-Class</strong><span class="badge">v0.1</span></div><p>俄语课堂 · 实时转写</p></header>
<main><section class="notes"><span class="eyebrow">课堂工作区</span><h1>留给思考的空间。</h1><p>笔记区域预留</p><small>当前版本提供右侧俄语实时字幕。</small></section>
<section class="transcription" aria-label="课堂转写"><div class="controls"><label>课程名称<input id="lesson" maxlength="120" placeholder="例如：信息安全导论"></label><label>访问令牌<input id="token" type="password" autocomplete="off" placeholder="输入服务端配置的访问令牌"></label><div class="actions"><button id="start">开始录音</button><button id="stop" disabled>停止</button><output id="duration">00:00</output></div><p id="status" role="status">尚未连接</p><p id="error" role="alert"></p><small id="worker">等待 ASR Worker</small></div>
<section class="history"><div class="history-title"><span>俄语</span><span>中文</span></div><div class="empty"><span>双语历史</span><p>将在后续版本提供</p></div></section>
<section class="live"><div class="live-heading"><span class="dot"></span>实时字幕 <small>滚动音频窗口</small></div><div class="ru"><span class="label">RU / WHISPER</span><p id="ru" lang="ru" aria-live="polite">开始录音后，俄语字幕将在这里更新。</p></div><div class="zh"><span class="label">ZH / LIVE</span><p>实时中文翻译 · 后续版本</p></div><small id="latency">窗口跨度 / 推理耗时 / 音频末端至显示延迟：—</small></section>
</section></main><footer>v0.1 暂不保存完整录音。请以前台方式使用，并另行保留重要课堂录音。</footer><script type="module" src="/app.js"></script></body></html>
