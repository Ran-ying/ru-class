<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RU-Class · v0.1</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main><section class="notes"><div class="workspace-top"><label>课程名称<input id="lesson" maxlength="120" placeholder="例如：信息安全导论"></label></div><div class="notes-placeholder"><span class="eyebrow">课堂工作区</span><h1>留给思考的空间。</h1><p>笔记区域预留</p><small>当前版本提供右侧俄语实时字幕。</small></div></section>
<section class="transcription" aria-label="课堂转写">
<section class="history"><div class="history-title"><span>俄语</span><span>中文</span></div><div class="empty"><span>双语历史</span><p>将在后续版本提供</p></div></section>
<section class="live"><div class="ru"><span class="label">RU</span><div id="connection-state" role="status"><p id="status">尚未连接</p><small id="worker">等待 ASR Worker</small></div><p id="ru" lang="ru" aria-live="polite" hidden>开始录音后，俄语字幕将在这里更新。</p></div><p id="error" role="alert"></p><div class="zh"><span class="label">ZH</span><p>实时中文翻译 · 后续版本</p></div></section>
</section><footer class="bottom-toolbar" aria-label="录音控制"><button id="record" type="button">开始录音</button><output id="duration" aria-label="录音时长">00:00</output><small id="latency">窗口跨度 / 推理耗时 / 音频末端至显示延迟：—</small><button id="settings-open" class="settings-button" type="button" aria-label="设置" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button></footer></main><dialog id="settings" aria-labelledby="settings-title"><div class="settings-heading"><h2 id="settings-title">设置</h2><form method="dialog"><button class="close-button" aria-label="关闭设置">×</button></form></div><label>网关访问令牌<input id="token" type="password" autocomplete="off" placeholder="输入服务端配置的访问令牌"></label><p class="settings-help">用于连接课堂网关，仅保留在当前页面内存中。</p><p id="worker-detail" class="settings-help">等待 ASR Worker</p><div class="service-settings"><h3>模型服务规划</h3><div><span>语音识别</span><small>本地 Whisper · 无需模型 API 密钥</small></div><div><span>多模态模型</span><small>后续版本 · 服务端独立配置</small></div><div><span>语言模型</span><small>后续版本 · 服务端独立配置</small></div></div></dialog><script type="module" src="/app.js"></script></body></html>
